<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>
(function(){
  try {
    var theme = localStorage.getItem("mms_theme");
    if (theme === "dark" || theme === "light") {
      document.documentElement.setAttribute("data-theme", theme);
    }
  } catch (e) {}
})();
</script>
<title>MMS Gallery - Reset Password</title>
<link rel="stylesheet" href="/css/theme.css">
<style>
.auth-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 100px 20px 60px;
}
.auth-card {
  width: 100%;
  max-width: 440px;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 40px 36px;
  box-shadow: var(--card-shadow-hover);
}
.auth-logo-area {
  text-align: center;
  margin-bottom: 32px;
}
.auth-logo {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--accent-primary);
  letter-spacing: -0.02em;
}
.auth-subtitle { 
  font-size: 0.95rem; 
  color: var(--text-muted); 
  margin-top: 8px; 
}
.form-wrap { display: flex; flex-direction: column; gap: 18px; }
.error-msg { 
  color: var(--danger); 
  font-size: 0.85rem; 
  font-weight: 500;
  display: none;
  padding: 12px;
  background: rgba(239, 68, 68, 0.1);
  border-radius: var(--radius-sm);
  margin-bottom: 20px;
}
.error-msg.show { display: block; }
.submit-btn { width: 100%; padding: 14px; font-size: 0.9rem; margin-top: 4px; }
.lang-switch {
  text-align: center;
  margin-top: 20px;
}
.lang-span {
  cursor: pointer;
  margin: 0 5px;
  font-size: 0.8rem;
  color: var(--text-muted);
}
.lang-span.active {
  color: var(--accent-primary);
  font-weight: bold;
}
</style>
</head>
<body>
<div class="bg-shapes">
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="bg-shape bg-shape-3"></div>
</div>
<div class="page">
  <nav>
    <a href="/" class="nav-logo">mmsgallery<small>SDU Student Exhibition</small></a>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo-area">
        <div class="auth-logo">mmsgallery</div>
        <div class="auth-subtitle" id="i18n-subtitle">Reset your password</div>
      </div>
      <div id="errorMsg" class="error-msg"></div>

      <div id="resetForm" class="form-wrap">
        <div class="form-group">
          <label class="form-label" id="i18n-newpass">New password</label>
          <input class="form-input" type="password" id="resetPass" placeholder="Minimum 6 characters" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" id="i18n-confirmpass">Confirm password</label>
          <input class="form-input" type="password" id="resetPass2" placeholder="Repeat password" autocomplete="new-password">
        </div>
        <button class="btn btn-primary submit-btn" onclick="doResetPassword()" id="i18n-submit">Confirm Reset</button>
      </div>

      <div class="lang-switch">
        <span class="lang-span" onclick="setLang('en')" id="lang-en">ENG</span>
        <span class="lang-span" onclick="setLang('ru')" id="lang-ru">РУС</span>
        <span class="lang-span" onclick="setLang('kk')" id="lang-kk">ҚАЗ</span>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
// I18N specific for this page
const translates = {
  en: {
    subtitle: 'Reset your password',
    newpass: 'New password',
    confirmpass: 'Confirm password',
    submit: 'Confirm Reset',
    errMissing: 'Missing reset token. Please use the link from your email.',
    errLength: 'Password must be at least 6 characters',
    errMatch: 'Passwords do not match',
    success: 'Password updated. Redirecting to login...'
  },
  ru: {
    subtitle: 'Сброс пароля',
    newpass: 'Новый пароль',
    confirmpass: 'Подтвердите пароль',
    submit: 'Подтвердить',
    errMissing: 'Нет токена сброса. Воспользуйтесь ссылкой из письма.',
    errLength: 'Пароль должен содержать минимум 6 символов',
    errMatch: 'Пароли не совпадают',
    success: 'Пароль изменён. Перенаправляем на вход...'
  },
  kk: {
    subtitle: 'Құпия сөзді қалпына келтіру',
    newpass: 'Жаңа құпия сөз',
    confirmpass: 'Құпия сөзді растаңыз',
    submit: 'Растау',
    errMissing: 'Қалпына келтіру токені жоқ. Электрондық поштаңыздағы сілтемені пайдаланыңыз.',
    errLength: 'Құпия сөз кемінде 6 таңбадан тұруы керек',
    errMatch: 'Құпия сөздер сәйкес келмейді',
    success: 'Құпия сөз өзгертілді. Кіру бетіне бағытталуда...'
  }
};

let currentLang = localStorage.getItem(I18N_KEY) || 'en';
if (!['en', 'ru', 'kk'].includes(currentLang)) currentLang = 'en';

function applyLang() {
  const t = translates[currentLang];
  document.getElementById('i18n-subtitle').textContent = t.subtitle;
  document.getElementById('i18n-newpass').textContent = t.newpass;
  document.getElementById('i18n-confirmpass').textContent = t.confirmpass;
  document.getElementById('i18n-submit').textContent = t.submit;
  
  document.getElementById('lang-en').className = currentLang === 'en' ? 'lang-span active' : 'lang-span';
  document.getElementById('lang-ru').className = currentLang === 'ru' ? 'lang-span active' : 'lang-span';
  document.getElementById('lang-kk').className = currentLang === 'kk' ? 'lang-span active' : 'lang-span';
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem(I18N_KEY, lang);
  applyLang();
}
applyLang();

function showError(message) {
  const box = document.getElementById('errorMsg');
  box.textContent = message;
  box.classList.add('show');
}
function hideError() {
  document.getElementById('errorMsg').classList.remove('show');
}

// Extrack token from hash: #access_token=...&type=recovery
let recoveryToken = '';
const hashParams = new URLSearchParams(location.hash.substring(1));
if (hashParams.get('type') === 'recovery' && hashParams.get('access_token')) {
  recoveryToken = hashParams.get('access_token');
}

async function doResetPassword() {
  hideError();
  const password = document.getElementById('resetPass').value;
  const pass2 = document.getElementById('resetPass2').value;
  const t = translates[currentLang];

  if (!recoveryToken) return showError(t.errMissing);
  if (!password || password.length < 6) return showError(t.errLength);
  if (password !== pass2) return showError(t.errMatch);

  try {
    document.getElementById('i18n-submit').disabled = true;
    await apiFetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${recoveryToken}` },
      body: JSON.stringify({ newPassword: password })
    });
    
    toast(t.success, 'success');
    setTimeout(() => { location.href = '/auth'; }, 2000);
  } catch (e) {
    showError(e.message);
    document.getElementById('i18n-submit').disabled = false;
  }
}
</script>
</body>
</html>
